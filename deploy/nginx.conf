# ============================================================
# Пример конфигурации nginx для stats.globaltruck.online
# Фронтенд: статика из /opt/transport-stats/dist
# API: проксируется на бэкенд (порт 3000)
# ============================================================
server {
    listen 80;
    server_name stats.globaltruck.online;

    root /opt/transport-stats/dist;
    index index.html;

    # Статические файлы фронтенда
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API → бэкенд
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: все остальные пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# После включения HTTPS (certbot): закомментируйте блок выше
# и используйте сгенерированный certbot конфиг для :443.
